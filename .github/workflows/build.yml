name: Build

on:
  push:
    branches:
      - main-neo/1.21.1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: NeoForge 1.21.1 build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4


      - name: Build
        run: ./gradlew :pbg-config-sync-fix:build --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: pbg-config-sync-fix-neoforge-1.21.1
          if-no-files-found: error
          path: |
            pbg-config-sync-fix/build/libs/*.jar
            !pbg-config-sync-fix/build/libs/*-sources.jar
            !pbg-config-sync-fix/build/libs/*-javadoc.jar
